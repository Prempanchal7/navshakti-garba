<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navshakti Admin Dashboard</title>

<link rel="stylesheet" href="dashboard.css">

</head>

<body>

<div class="container">

    <h1>🕉️ Navshakti Garba Admin</h1>

    <div class="card">

        <h2>Upload Photo / Video</h2>

        <input type="file" id="file">

        <button id="uploadBtn">Upload</button>

        <p id="status"></p>

    </div>

    <div class="card">

        <h2>Add Review</h2>

        <input type="text" id="reviewName" placeholder="Student Name">

        <textarea id="reviewText" placeholder="Write Review"></textarea>

        <button id="reviewBtn">Add Review</button>

    </div>

    <div class="card">

        <h2>Gallery Preview</h2>

        <div id="gallery"></div>

    </div>

    <div class="card">
    <h2>Reviews Preview</h2>
    <div id="reviews"></div>
</div>

    <button id="logoutBtn">Logout</button>

</div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
